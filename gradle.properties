# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Loom is not compatible with the configuration cache under IntelliJ IDEA.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric — checked against the 26.2 branch of FabricMC/fabric-example-mod,
# meta.fabricmc.net and maven.fabricmc.net on 2026-09-06.
# Note: the example mod pins loom to 1.17-SNAPSHOT because it is FabricMC's own
# dev repository. Stable releases of that line are 1.17.1 .. 1.17.20; 1.17.19 is
# the one already building on this machine.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.19
fabric_api_version=0.159.0+26.2

# Mod
version=1.0.0
group=re.jerome
